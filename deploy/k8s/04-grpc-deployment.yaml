apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortex-grpc
  namespace: vortex
  labels:
    app: vortex-grpc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vortex-grpc
  template:
    metadata:
      labels:
        app: vortex-grpc
    spec:
      containers:
        - name: vortex-grpc
          image: vortex-grpc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50055
          envFrom:
            - configMapRef:
                name: vortex-config
            - secretRef:
                name: vortex-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vortex-grpc
  namespace: vortex
  labels:
    app: vortex-grpc
spec:
  type: ClusterIP
  selector:
    app: vortex-grpc
  ports:
    - name: grpc
      port: 50055
      targetPort: 50055