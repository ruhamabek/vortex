apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vortex-worker-hpa
  namespace: vortex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vortex-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70