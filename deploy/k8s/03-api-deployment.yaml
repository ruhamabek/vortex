apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortex-api
  namespace: vortex
  labels:
    app: vortex-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vortex-api
  template:
    metadata:
      labels:
        app: vortex-api
    spec:
      containers:
        - name: vortex-api
          image: vortex-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vortex-config
            - secretRef:
                name: vortex-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vortex-api
  namespace: vortex
  labels:
    app: vortex-api
spec:
  type: ClusterIP
  selector:
    app: vortex-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080