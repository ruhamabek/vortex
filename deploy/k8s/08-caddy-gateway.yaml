apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-gateway
  namespace: vortex
  labels:
    app: caddy-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caddy-gateway
  template:
    metadata:
      labels:
        app: caddy-gateway
    spec:
      containers:
        - name: caddy
          image: caddy:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: caddy-config-volume
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: caddy-config-volume
          configMap:
            name: caddy-config
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-gateway
  namespace: vortex
  labels:
    app: caddy-gateway
spec:
  type: NodePort
  selector:
    app: caddy-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080